<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Community Food Pantry Volunteer Signup</title>
</head>
<body>
  <header>
    <h1>Community Food Pantry Volunteer Signup</h1>
  </header>
  <nav aria-label="Main navigation">
    <a href="/volunteer-guide.html">Read the volunteer guide</a>
  </nav>
  <main>
    <p>Neighbors can use this page to learn about pantry volunteer shifts, accessibility support, and contact options.</p>
    <img src="pantry-team.jpg" alt="Volunteers packing food boxes at the community pantry">
    <form action="/volunteer" method="post">
      <label for="name">Name</label>
      <input id="name" name="name" type="text">
      <button type="submit">Request a volunteer shift</button>
    </form>
  </main>
  <footer>
    <p>Contact the pantry team for help with this page.</p>
  </footer>
</body>
</html>
