name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Run CLI smoke checks
        run: |
          python3 accessaid_lite.py check --html examples/good-page.html
          python3 accessaid_lite.py check --html examples/missing-alt.html --format json || test "$?" -eq 2
          python3 accessaid_lite.py check --html examples/form-without-label.html || test "$?" -eq 2
          python3 accessaid_lite.py init-config --output /tmp/accessaid-lite.config.json
